<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Broken Staging Sandbox</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 24px; background: #fafafa; color: #333; }
    .overlap-wrap { position: relative; height: 80px; margin: 24px 0; }
    .overlap-a, .overlap-b {
      position: absolute; padding: 8px 16px; border: 0; cursor: pointer;
    }
    .overlap-a { left: 0; top: 0; background: #ff4d6d; color: #fff; z-index: 1; }
    .overlap-b { left: 40px; top: 12px; background: #4cc9f0; z-index: 2; }
    .tiny { font-size: 8px; padding: 1px 2px; }
    .low-contrast { color: #c8c8c8; }
    h3 { margin-top: 32px; }
  </style>
</head>
<body>
  <h2>Welcome to the intentionally broken sandbox</h2>
  <p class="low-contrast">This gray-on-gray copy is a contrast trap for Agent B.</p>
  <img src="https://placehold.co/120x80" />
  <img src="https://placehold.co/40x40/png" alt="" />

  <form id="empty-form" action="/does-not-exist" method="post">
    <input type="text" name="email" placeholder="email with no label" />
    <textarea name="bio"></textarea>
    <button>Submit empty</button>
  </form>

  <div class="overlap-wrap">
    <button class="overlap-a" type="button">Save changes</button>
    <button class="overlap-b" type="button">Cancel</button>
  </div>

  <button class="tiny" type="button" onclick="boom()">x</button>
  <a href="#"></a>
  <iframe src="about:blank"></iframe>
  <div id="dup"></div>
  <span id="dup"></span>

  <script>
    console.error("sandbox console.error planted for Agent C");
    function boom() {
      throw new Error("Unhandled sandbox exception from rage click");
    }
    fetch("/api/not-a-real-endpoint-404");
    fetch("/definitely-missing").then(() => {});
    setTimeout(() => {
      Promise.reject("unhandled rejection from sandbox");
      throw new Error("Delayed unhandled JavaScript exception");
    }, 400);
  </script>
</body>
</html>
